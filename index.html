<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f3">
  <meta name="description" content="Нежное интерактивное приглашение на свидание — выбери день, настроение и открой маленький сюрприз.">
  <title>Маленькое свидание — приглашение</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #352038;
      --muted: #887d8c;
      --wine: #6b3153;
      --berry: #a43d68;
      --coral: #f36b7c;
      --peach: #ffb18d;
      --blush: #f9d9df;
      --cream: #fff8f3;
      --paper: #fffdfb;
      --line: rgba(97, 54, 82, .12);
      --shadow: 0 28px 80px rgba(77, 33, 65, .13);
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Aptos", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--cream); }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(ellipse at 8% 12%, rgba(255, 207, 209, .7), transparent 31rem),
        radial-gradient(ellipse at 94% 80%, rgba(255, 217, 186, .48), transparent 28rem),
        linear-gradient(135deg, #fff9f4, #fff2f4 48%, #fff9f2);
      overflow-x: hidden;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button:disabled { cursor: not-allowed; opacity: .46; transform: none !important; box-shadow: none !important; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 3px solid rgba(243, 107, 124, .5);
      outline-offset: 3px;
    }
    .page-noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: .16;
      background-image: radial-gradient(rgba(109, 63, 85, .22) .55px, transparent .55px);
      background-size: 6px 6px;
      mask-image: linear-gradient(to bottom, #000, transparent 88%);
    }
    .page-wrap { width: min(1160px, calc(100% - 48px)); margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 94px;
      gap: 20px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .brand-mark {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 14px;
      background: linear-gradient(145deg, #fff, #ffe1e4);
      box-shadow: 0 8px 22px rgba(179, 89, 120, .14);
      color: var(--berry);
      font-size: 19px;
    }
    .topnote {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #857586;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .topnote::before { content: ""; width: 22px; height: 1px; background: #d4afbd; }
    .topnote::after { content: ""; width: 22px; height: 1px; background: #d4afbd; }
    .main-area { padding: 10px 0 76px; }
    .hero-card {
      position: relative;
      display: grid;
      grid-template-columns: 1fr .92fr;
      min-height: 620px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 34px;
      background: rgba(255, 253, 251, .76);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .hero-copy {
      position: relative;
      z-index: 1;
      align-self: center;
      padding: clamp(38px, 6.8vw, 86px);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--berry);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .eyebrow .sparkle { font-size: 15px; }
    h1, h2, p { margin-top: 0; }
    .hero-copy h1 {
      max-width: 580px;
      margin: 24px 0 18px;
      font-family: var(--serif);
      font-size: clamp(52px, 7vw, 89px);
      font-weight: 500;
      letter-spacing: -.07em;
      line-height: .98;
    }
    .hero-copy h1 em { color: var(--berry); font-weight: 500; }
    .hero-intro {
      max-width: 440px;
      margin-bottom: 30px;
      color: #796e7e;
      font-size: 16px;
      line-height: 1.75;
    }
    .button-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .btn {
      position: relative;
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 17px;
      padding: 0 22px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 750;
      text-decoration: none;
      transition: transform .22s ease, box-shadow .22s ease, background .22s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0) scale(.985); }
    .btn:disabled { cursor: not-allowed; opacity: .48; transform: none; box-shadow: none; }
    .btn-primary {
      color: white;
      background: linear-gradient(120deg, #bd4f78, #f0747e 72%, #f68e77);
      box-shadow: 0 13px 27px rgba(195, 77, 113, .25), inset 0 1px 0 rgba(255,255,255,.25);
    }
    .btn-primary:hover { box-shadow: 0 17px 34px rgba(195, 77, 113, .34); }
    .btn-quiet {
      color: #766879;
      background: rgba(255,255,255,.66);
      border: 1px solid var(--line);
    }
    .btn-quiet:hover { background: #fff; }
    .small-note { display: flex; align-items: center; gap: 8px; margin-top: 24px; color: #9a8c98; font-size: 12px; }
    .small-note span { color: var(--coral); }
    .hero-art {
      position: relative;
      display: grid;
      min-height: 530px;
      place-items: center;
      padding: 42px;
      isolation: isolate;
    }
    .hero-art::before {
      position: absolute;
      z-index: -2;
      top: 9%;
      right: 4%;
      width: 83%;
      height: 78%;
      border-radius: 48% 52% 46% 54% / 45% 46% 54% 55%;
      background: linear-gradient(145deg, #f9cbd2 2%, #ffe4d3 56%, #f6d8e2);
      content: "";
      transform: rotate(-8deg);
    }
    .sun-disc {
      position: absolute;
      top: 12%;
      left: 8%;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #fff0c9;
      filter: blur(.15px);
      opacity: .8;
      z-index: -1;
    }
    .orbital {
      position: absolute;
      top: 16%;
      right: 7%;
      width: 105px;
      height: 105px;
      border: 1px solid rgba(126, 69, 103, .16);
      border-radius: 50%;
      animation: orbit 18s linear infinite;
    }
    .orbital::before { position: absolute; top: 6px; left: 15px; width: 9px; height: 9px; border-radius: 50%; background: white; content: ""; box-shadow: 0 0 12px #fff; }
    .ticket-art {
      position: relative;
      display: flex;
      width: min(100%, 392px);
      min-height: 418px;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 27px;
      padding: 25px;
      color: white;
      background:
        radial-gradient(circle at 80% 18%, rgba(255, 172, 158, .4), transparent 27%),
        radial-gradient(circle at 18% 90%, rgba(241, 111, 144, .28), transparent 30%),
        linear-gradient(151deg, #311a3a, #512544 56%, #78304c);
      box-shadow: 0 26px 55px rgba(79, 37, 68, .27), inset 0 1px 0 rgba(255,255,255,.18);
      transform: rotate(3deg);
      animation: cardFloat 5.5s ease-in-out infinite;
    }
    .ticket-art::after {
      position: absolute;
      right: -24px;
      bottom: 76px;
      left: -24px;
      height: 1px;
      background-image: linear-gradient(to right, rgba(255,255,255,.34) 50%, transparent 0%);
      background-size: 8px 1px;
      content: "";
    }
    .ticket-top, .ticket-bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .ticket-kicker { color: #f2c4cd; font-size: 10px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    .ticket-heart { display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid rgba(255,255,255,.24); border-radius: 50%; color: #ffd2d8; }
    .ticket-title { margin: 7px 0 0; font-family: var(--serif); font-size: clamp(34px, 4.4vw, 49px); font-weight: 500; letter-spacing: -.04em; line-height: .98; }
    .ticket-subtitle { margin: 12px 0 0; color: #ead3df; font-size: 13px; line-height: 1.55; }
    .ticket-illustration { position: relative; display: grid; min-height: 164px; place-items: center; margin: 11px -4px 8px; }
    .moon { position: absolute; width: 154px; height: 154px; border: 1px solid rgba(255,255,255,.3); border-radius: 50%; box-shadow: 0 0 50px rgba(255, 205, 193, .1), inset 0 0 26px rgba(255, 207, 221, .06); }
    .moon::before { position: absolute; top: 11px; right: 10px; width: 16px; height: 16px; border-radius: 50%; background: #ffd9af; box-shadow: 0 0 24px #ffd9af; content: ""; }
    .ticket-cat { position: relative; z-index: 1; font-size: 120px; line-height: 1; filter: drop-shadow(0 15px 15px rgba(13, 7, 20, .28)); animation: catBob 3.2s ease-in-out infinite; }
    .ticket-paw { position: absolute; right: 27px; bottom: 17px; font-size: 24px; opacity: .8; transform: rotate(18deg); }
    .ticket-bottom { align-items: end; padding-top: 24px; }
    .ticket-meta { display: grid; gap: 5px; color: #d5b8c9; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .ticket-meta strong { color: white; font-size: 13px; letter-spacing: 0; text-transform: none; }
    .ticket-stamp { color: #ffe0cc; font-family: var(--serif); font-size: 27px; transform: rotate(-8deg); }
    .floating-heart { position: absolute; color: rgba(178, 82, 123, .5); font-size: 20px; animation: drift 5s ease-in-out infinite; }
    .heart-one { top: 19%; left: 13%; }
    .heart-two { right: 5%; bottom: 23%; font-size: 27px; animation-delay: -2.2s; }
    .heart-three { left: 5%; bottom: 17%; font-size: 16px; animation-delay: -3.4s; }
    .hero-caption { position: absolute; right: 0; bottom: 9%; left: 0; color: #926c84; font-family: var(--serif); font-size: 18px; font-style: italic; text-align: center; }

    .door-card {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
      min-height: 620px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.86);
      border-radius: 34px;
      background: rgba(255,253,251,.78);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      transition: grid-template-columns .75s cubic-bezier(.2,.8,.2,1);
    }
    .door-card.opened { grid-template-columns: minmax(0, 0fr) minmax(0, 1fr); }
    .door-copy {
      position: relative;
      z-index: 4;
      align-self: center;
      padding: clamp(38px, 6.5vw, 78px);
      transition: opacity .35s ease, transform .45s ease, padding .5s ease;
    }
    .door-copy h1 {
      margin: 24px 0 18px;
      font-family: var(--serif);
      font-size: clamp(49px, 6.2vw, 76px);
      font-weight: 500;
      letter-spacing: -.07em;
      line-height: .98;
    }
    .door-copy h1 em { color: var(--berry); font-weight: 500; }
    .door-copy p { max-width: 390px; margin: 0 0 28px; color: #796e7e; font-size: 15px; line-height: 1.75; }
    .door-card.opened .door-copy { width: 0; min-width: 0; overflow: hidden; padding: 0; opacity: 0; transform: translateX(-20px); pointer-events: none; }
    .door-stage {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 580px;
      place-items: center;
      padding: 34px 42px;
      perspective: 1500px;
      isolation: isolate;
    }
    .door-halo {
      position: absolute;
      z-index: -1;
      inset: 7% 3% 5%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255,220,208,.9), rgba(255,221,228,.58) 48%, transparent 73%);
      filter: blur(3px);
      transition: transform 1s ease, opacity .8s ease;
    }
    .door-frame {
      position: relative;
      width: min(100%, 440px);
      height: 500px;
      border: 10px solid rgba(255,255,255,.83);
      border-bottom: 0;
      border-radius: 225px 225px 13px 13px;
      background: linear-gradient(160deg, #fbd9da, #fff0d7 52%, #f8cbd7);
      box-shadow: 0 26px 55px rgba(106,48,82,.2), inset 0 0 0 1px rgba(159,88,119,.15);
      transform-style: preserve-3d;
    }
    .door-frame::before {
      position: absolute;
      z-index: 0;
      inset: 10px;
      border: 1px solid rgba(255,255,255,.77);
      border-radius: 205px 205px 4px 4px;
      content: "";
      pointer-events: none;
    }
    .door-reveal {
      position: absolute;
      z-index: 1;
      inset: 14px 14px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 195px 195px 5px 5px;
      padding: 34px clamp(16px, 4vw, 30px) 29px;
      color: var(--ink);
      background:
        radial-gradient(circle at 51% 26%, rgba(255,255,255,.92), transparent 36%),
        linear-gradient(160deg, rgba(255,247,233,.94), rgba(255,224,226,.95) 60%, rgba(253,199,211,.96));
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translateX(16px) scale(.97);
      transition: opacity .52s ease .34s, transform .68s cubic-bezier(.2,.8,.2,1) .31s, visibility 0s linear .31s;
    }
    .door-card.opened .door-reveal { opacity: 1; visibility: visible; transform: none; transition-delay: .34s, .31s, .31s; }
    .door-reveal .inside-pet { margin-bottom: 4px; font-size: 42px; line-height: 1; filter: drop-shadow(0 6px 7px rgba(100,49,77,.13)); animation: catBob 3s ease-in-out infinite; }
    .door-reveal .inside-label { margin: 12px 0 9px; color: #a05275; font-size: 9px; font-weight: 850; letter-spacing: .19em; text-transform: uppercase; }
    .door-reveal h2 { margin: 0; font-family: var(--serif); font-size: clamp(28px, 3.7vw, 39px); font-weight: 500; letter-spacing: -.055em; line-height: 1.02; }
    .door-reveal h2 em { color: var(--berry); font-weight: 500; }
    .door-reveal p { max-width: 280px; margin: 12px 0 18px; color: #817383; font-size: 11px; line-height: 1.55; }
    .door-actions { width: 100%; flex-direction: column; gap: 9px; }
    .door-actions .btn { width: 100%; min-height: 44px; border-radius: 14px; padding: 0 12px; font-size: 11px; }
    .door-leaf {
      position: absolute;
      z-index: 3;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 0;
      border-radius: 215px 215px 5px 5px;
      padding: 0;
      color: #ffe3b9;
      background:
        radial-gradient(ellipse at 36% 20%, rgba(255,255,255,.12), transparent 44%),
        linear-gradient(115deg, #8e3d64, #713253 58%, #5d2d50);
      box-shadow: inset 9px 0 18px rgba(47,21,43,.18), inset -10px 0 20px rgba(42,19,39,.12), 12px 12px 23px rgba(68,31,62,.22);
      cursor: pointer;
      transform: rotateY(0deg);
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform .95s cubic-bezier(.15,.76,.28,1), box-shadow .7s ease;
      backface-visibility: visible;
    }
    .door-leaf::before {
      position: absolute;
      inset: 15px;
      border: 1px solid rgba(255,232,203,.32);
      border-radius: 200px 200px 4px 4px;
      content: "";
      pointer-events: none;
    }
    .door-leaf:hover { filter: brightness(1.07); }
    .door-card.opened .door-leaf { box-shadow: inset 9px 0 18px rgba(47,21,43,.18), -18px 15px 22px rgba(68,31,62,.14); transform: rotateY(-91deg); pointer-events: none; }
    .door-panel {
      position: absolute;
      right: 17%;
      left: 17%;
      border: 1px solid rgba(255,229,202,.28);
      box-shadow: inset 0 0 0 5px rgba(255,255,255,.035);
      pointer-events: none;
    }
    .door-panel.upper { top: 12%; height: 29%; border-radius: 140px 140px 8px 8px; }
    .door-panel.lower { top: 46%; bottom: 7%; border-radius: 8px; }
    .door-knob {
      position: absolute;
      top: 51%;
      right: 11%;
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border: 2px solid #f8cf94;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff0c9, #d79752);
      box-shadow: 0 0 0 4px rgba(255,221,172,.08), 0 2px 8px rgba(30,12,27,.32);
      pointer-events: none;
    }
    .door-heart { position: absolute; top: 22%; left: 0; right: 0; color: rgba(255,231,206,.8); font-family: var(--serif); font-size: 38px; pointer-events: none; }
    .door-open-hint { position: absolute; right: 0; bottom: 5%; left: 0; color: rgba(255,235,215,.8); font-size: 9px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; pointer-events: none; }
    .door-card.opened .door-frame { box-shadow: 0 32px 72px rgba(124,55,94,.2), 0 0 60px rgba(255,226,192,.46); }
    .door-card.opened .door-halo { opacity: 1; transform: scale(1.13); }
    .door-floor-note { position: absolute; bottom: 0; left: 50%; color: #a88198; font-family: var(--serif); font-size: 13px; font-style: italic; white-space: nowrap; transform: translate(-50%, 22px); transition: opacity .25s ease; }
    .door-card.opened .door-floor-note { opacity: 0; }

    .flow-card {
      width: min(100%, 900px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 34px;
      background: rgba(255,253,251,.83);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .flow-head { padding: 38px clamp(25px, 6vw, 66px) 24px; border-bottom: 1px solid rgba(116,67,93,.09); }
    .flow-topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .back-button { display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 7px 0; color: #837282; background: none; cursor: pointer; font-size: 13px; font-weight: 700; }
    .back-button:hover { color: var(--berry); }
    .step-label { color: #a08d9d; font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .progress { display: flex; align-items: center; gap: 7px; }
    .progress-dot { width: 8px; height: 8px; border-radius: 9px; background: #eddde2; transition: all .3s ease; }
    .progress-dot.active { width: 29px; background: linear-gradient(90deg, #bf557a, #f28a83); }
    .flow-head h1 { margin: 0 0 10px; font-family: var(--serif); font-size: clamp(35px, 5vw, 55px); font-weight: 500; letter-spacing: -.055em; line-height: 1.05; }
    .flow-head p { max-width: 610px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .flow-body { padding: 32px clamp(25px, 6vw, 66px) 48px; }
    .section-label { margin: 0 0 14px; color: #a08c9b; font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    .date-choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .date-choice {
      position: relative;
      display: flex;
      min-height: 190px;
      flex-direction: column;
      align-items: flex-start;
      border: 1px solid rgba(105, 57, 86, .12);
      border-radius: 23px;
      padding: 21px 22px;
      overflow: hidden;
      background: rgba(255,255,255,.78);
      cursor: pointer;
      text-align: left;
      transition: transform .23s ease, border-color .23s ease, box-shadow .23s ease, background .23s ease;
    }
    .date-choice::after { position: absolute; top: 19px; right: 19px; width: 18px; height: 18px; border: 1px solid rgba(118,67,92,.22); border-radius: 50%; content: ""; transition: all .2s ease; }
    .date-choice:hover { transform: translateY(-3px); border-color: rgba(196, 83, 123, .42); box-shadow: 0 12px 28px rgba(91,47,78,.1); }
    .date-choice.selected { border-color: var(--berry); background: linear-gradient(135deg, #fff8f5, #fff1f2); box-shadow: 0 12px 28px rgba(165,60,104,.12); }
    .date-choice.selected::after { border: 5px solid white; background: var(--berry); box-shadow: 0 0 0 1px var(--berry); }
    .date-choice-icon { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 15px; margin-bottom: 16px; background: linear-gradient(145deg, #ffe3e3, #fff1d7); font-size: 21px; }
    .date-choice-title { display: block; max-width: calc(100% - 18px); font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: -.035em; line-height: 1.12; }
    .date-choice-date { display: inline-flex; align-items: center; gap: 6px; margin-top: auto; padding-top: 13px; color: #805469; font-size: 12px; font-weight: 750; }
    .flow-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 26px; }
    .flow-actions .hint { max-width: 320px; color: #a08f9f; font-size: 11px; line-height: 1.5; }
    .field-error { display: none; margin: 10px 0 0; color: #b23e61; font-size: 12px; }
    .field-error.show { display: block; }

    .no-card {
      position: relative;
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      min-height: 470px;
      overflow: hidden;
      border-radius: 34px;
      background: linear-gradient(120deg, #fffdfa, #fff1f0);
      box-shadow: var(--shadow);
    }
    .no-art { position: relative; display: grid; min-height: 360px; place-items: center; background: radial-gradient(circle at 52% 45%, #ffe5d1, #f8d4dc 58%, #f3d5e2); }

      const prompt = noPrompts[Math.max(0, Math.min(state.noCount - 1, noPrompts.length - 1))];
      const promptNumber = Math.max(1, Math.min(state.noCount, noPrompts.length));
      return `<section class="no-card screen-enter">
        <div class="no-art"><span class="no-mascot" aria-hidden="true">${prompt.emoji}</span><span class="no-sidekick" aria-hidden="true">${prompt.pal}</span></div>
        <div class="no-copy">
          <div class="no-count">уточнение ${String(promptNumber).padStart(2,"0")} / 10</div>
          <h1>Совсем-совсем?</h1>
          <p>${safe(prompt.text)}</p>
          <div class="button-row">
            <button class="btn btn-primary" type="button" data-action="yes">Ладно, давай 💗</button>
            <button class="btn btn-quiet" type="button" data-action="no-again">Нет, точно</button>
          </div>
          <button class="no-exit" type="button" data-action="finish-no">Это окончательный ответ</button>
        </div>
      </section>`;
    }
    function renderNoEnd() {
      return `<section class="no-end screen-enter">
        <div class="end-pet" aria-hidden="true">🐈‍⬛</div>
        <div class="eyebrow" style="justify-content:center"><span class="sparkle">✦</span> котик отправляет сердечки</div>
        <h1>Понимаю 💌</h1>
        <p>Больше не уговариваю. Спасибо за честный ответ — если однажды захочешь, приглашение будет ждать тебя здесь.</p>
        <button class="btn btn-quiet" type="button" data-action="reset">Закрыть приглашение</button>
      </section>`;
    }
    function renderDate() {
      return `<section class="flow-card screen-enter">
        ${flowHeader(1, "две даты", "Какой вечер выберешь?", "Два спектакля и две даты — оба начинаются в 20:00.", "landing")}
        <div class="flow-body">
          <div class="date-choice-grid" role="group" aria-label="Выбери одну из двух дат">
            ${dateOptions.map(option => `<button class="date-choice ${state.dateId === option.id ? "selected" : ""}" type="button" data-action="choose-date" data-date-id="${option.id}" aria-pressed="${state.dateId === option.id}">
              <span class="date-choice-icon" aria-hidden="true">🎭</span><span class="date-choice-title">${safe(option.title)}</span><span class="date-choice-date">🗓️ ${safe(prettyDate(option.date))} · 20:00</span>
            </button>`).join("")}
          </div>
          <div class="flow-actions"><span class="hint">Выбери одну дату.</span><button class="btn btn-primary" type="button" data-action="to-gift" ${state.dateId ? "" : "disabled"}>Собрать приглашение <span aria-hidden="true">→</span></button></div>
        </div>
      </section>`;
    }
    function renderGift() {
      return `<section class="gift-wrap screen-enter ${state.opened ? "open" : ""}" id="gift-wrap">
        <div class="gift-glow"></div><div class="balloon-field" id="balloon-field" aria-hidden="true"></div>
        <div class="gift-copy"><div class="eyebrow"><span class="sparkle">✦</span> финальный сюрприз</div><h1>Тут кое-что для тебя</h1><p>Открой коробочку — внутри уже собрано твоё приглашение.</p></div>
        <div class="gift-button-wrap"><button class="gift-box" type="button" data-action="open-gift" aria-label="Открыть коробочку с приглашением"><span class="gift-lid"></span><span class="gift-base"></span><span class="gift-ribbon"></span><span class="gift-pawmark">♡</span></button><div class="gift-tap">нажми, чтобы открыть <span>↗</span></div></div>
        <article class="invite-card" id="invite-card" aria-label="Твоё приглашение">
          ${renderInviteCard()}
        </article>
        <div class="celebrate-hint">${state.opened ? "Сохрани приглашение или просто оставь эту страницу открытой ♡" : "Внутри — выбранный спектакль и дата."}</div>
      </section>`;
    }
    function renderInviteCard() {
      const option = dateOptions.find(item => item.id === state.dateId);
      return `<div class="invite-card-top"><span>официальное приглашение</span><span aria-hidden="true">♡</span></div>
        <h2>Сходим<br>на свидание?</h2>
        <p class="to-line">Ты приглашён пойти со мной на спектакль.</p>
        <div class="invite-details">
          <div class="invite-detail"><span class="detail-icon">🗓️</span><div><strong>${safe(prettyDate(state.date))}</strong><small>начало в ${safe(state.time || "20:00")}</small></div></div>
          <div class="invite-detail"><span class="detail-icon">🎭</span><div><strong>${safe(option?.title || "Спектакль")}</strong><small>вечер вдвоём ♡</small></div></div>
        </div>
        <div class="invite-sign"><span>с нежностью,</span><strong>от меня ♡</strong></div>
        <div class="invite-actions"><button class="btn btn-primary" type="button" data-action="copy-invite">Скопировать приглашение</button><button class="btn btn-quiet" type="button" data-action="reset">Сначала</button></div>`;
    }
    function render() {
      const views = {
        landing: renderLanding,
        no: renderNo,
        noEnd: renderNoEnd,
        date: renderDate,
        gift: renderGift
      };
      app.innerHTML = (views[state.screen] || renderLanding)();
      if (state.screen === "gift" && state.opened) {
        requestAnimationFrame(() => balloonBurst());
      }
    }
    function go(screen) { state.screen = screen; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2700);
    }
    function heartBurst(count = 12) {
      const colors = ["#f36b7c", "#be5780", "#ffc87d", "#a96eb0", "#ff9aa8"];
      for (let i = 0; i < count; i++) {
        const heart = document.createElement("span");
        heart.className = "heart-burst";
        heart.textContent = ["♡", "♥", "✦", "💗"][Math.floor(Math.random() * 4)];
        heart.style.setProperty("--x", `${30 + Math.random() * 40}vw`);
        heart.style.setProperty("--y", `${28 + Math.random() * 42}vh`);
        heart.style.setProperty("--dx", `${Math.round((Math.random() - .5) * 230)}px`);
        heart.style.setProperty("--dy", `${Math.round(-70 - Math.random() * 230)}px`);
        heart.style.setProperty("--turn", `${Math.round((Math.random() - .5) * 160)}deg`);
        heart.style.setProperty("--size", `${14 + Math.random() * 18}px`);
        heart.style.setProperty("--duration", `${1.5 + Math.random() * 1.3}s`);
        heart.style.setProperty("--color", colors[Math.floor(Math.random() * colors.length)]);
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3100);
      }
    }
    function balloonBurst() {
      const field = document.getElementById("balloon-field");
      if (!field) return;
      field.innerHTML = "";
      const balloons = ["🎈", "🎈", "💗", "🎈", "💖", "🎈", "💝", "🎈", "💗", "🎈", "✨", "🎈"];
      balloons.forEach((emoji, index) => {
        const balloon = document.createElement("span");
        balloon.className = "balloon";
        balloon.textContent = emoji;
        balloon.style.left = `${4 + Math.random() * 90}%`;
        balloon.style.setProperty("--duration", `${5.1 + Math.random() * 2.5}s`);
        balloon.style.setProperty("--delay", `${Math.random() * .9}s`);
        balloon.style.fontSize = `${32 + Math.random() * 22}px`;
        field.appendChild(balloon);
        setTimeout(() => balloon.remove(), 8500 + index * 25);
      });
      heartBurst(24);
    }
    function inviteText() {
      const option = dateOptions.find(item => item.id === state.dateId);
      return `Приглашение 💌\n\nХочу позвать тебя на свидание!\nТы приглашён пойти со мной на ${option?.title || "спектакль"}.\n${prettyDate(state.date)} в ${state.time}\n\nС нежностью, от меня ♡`;
    }

    app.addEventListener("click", async event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      if (action === "open-door") {
        if (state.doorOpened) return;
        state.doorOpened = true;
        document.getElementById("door-card")?.classList.add("opened");
        window.setTimeout(() => document.querySelector(".door-reveal [data-action=\"yes\"]")?.focus(), 1050);
      } else if (action === "yes") {
        heartBurst(10);
        go("date");
      } else if (action === "no") {
        state.noCount = 1;
        go("no");
      } else if (action === "no-again") {
        if (state.noCount >= noPrompts.length) {
          state.screen = "noEnd";
          render();
          heartBurst(18);
        } else {
          state.noCount += 1;
          render();
          heartBurst(7);
        }
      } else if (action === "finish-no") {
        state.screen = "noEnd";
        render();
        heartBurst(14);
      } else if (action === "choose-date") {
        const selected = dateOptions.find(option => option.id === button.dataset.dateId);
        if (!selected) return;
        state.dateId = selected.id;
        state.date = selected.date;
        state.time = "20:00";
        render();
      } else if (action === "to-gift") {
        if (!state.dateId) return;
        state.opened = false;
        go("gift");
      } else if (action === "open-gift") {
        state.opened = true;
        render();
      } else if (action === "copy-invite") {
        try {
          await navigator.clipboard.writeText(inviteText());
          showToast("Приглашение скопировано 💌");
        } catch {
          showToast("Не получилось скопировать автоматически — выдели текст карточки.");
        }
      } else if (action === "reset") {
        Object.assign(state, { screen: "landing", doorOpened: false, noCount: 0, dateId: "", date: "", time: "20:00", opened: false });
        go("landing");
      } else if (action === "landing") {
        go("landing");
      } else if (action === "date") {
        go("date");
      }
    });

    render();
  </script>
</body>
</html>
